name: Report contract with kouchou-ai

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 09:00 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KOUCHOU_AI_SOURCE: ${{ github.workspace }}/kouchou-ai
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: digitaldemocracy2030/kouchou-ai
          # PR と push は確認済みの版。定期・手動実行は本家 main の変更を検査する。
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'main' || 'b97138779e78f65b7824fb9a12b8f9405c2a128b' }}
          path: kouchou-ai
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/v4.4.0/elan-init.sh | sh -s -- -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Load the pinned Lean toolchain
        working-directory: kouchou-ai/packages/analysis-core/verification/opinion-sources
        run: lean --version
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -e "kouchou-ai/packages/analysis-core[clustering]" -r conformance/requirements.txt
      - name: PythonとTypeScriptで共通の性質を検査
        run: python -m pytest -q conformance --hypothesis-show-statistics
